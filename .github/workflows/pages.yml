name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for tool/version.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Without --build-name the web version.json (read by package_info_plus) says pubspec's 1.0.0.
      # APP_BUILD lets the running app notice a newer deploy (it compares with version.json);
      # the cache-bust makes a reload actually fetch the new scripts.
      - run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --build-name="$(bash tool/version.sh)" --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }}
          bash tool/web_cache_bust.sh build/web ${{ github.run_number }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
