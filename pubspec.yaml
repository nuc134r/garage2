name: garage
description: "Vehicle fuel, service and expense tracker."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  uuid: ^4.6.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  animations: ^3.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:

  uses-material-design: true
  generate: true

